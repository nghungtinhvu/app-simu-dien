<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111214">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mô phỏng tủ điện</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: công cụ kỹ thuật, tối, tập trung như phần mềm thiết kế tủ điện.
   IDEA: tấm lưới lắp ráp tủ điện; dây có điện sáng lên khi chạy mô phỏng.
   PICTURE: chính bản vẽ đang chạy.
   COLOUR+TYPE: nền than #111214, nhấn teal #0f9b8e, dây có điện cam #ff8a3d; Geist.
   LAYOUT: canvas toàn màn hình, thanh công cụ dưới, thư viện trái, thuộc tính phải. */
:root{color-scheme:dark;--bg:#111214;--panel:#17191c;--line:#2a2d32;--ink:#e8eaed;--mut:#8b9098;--acc:#0f9b8e;--acc2:#14b8a6;--warn:#ff8a3d;--bad:#ef4444}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 Geist,system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
/* ---------- home ---------- */
#home{position:absolute;inset:0;display:flex;flex-direction:column}
.hbar{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.logo{width:30px;height:30px;border-radius:8px;background:var(--acc);display:grid;place-items:center}
.hbar h1{font-size:19px;font-weight:600;margin:0;flex:1}
.hlist{flex:1;overflow:auto;padding:12px 20px 110px;max-width:1100px;width:100%;margin:0 auto}
.card{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:10px;border:1px solid transparent;cursor:pointer}
.card:hover{background:#1a1c20;border-color:var(--line)}
.card .ic{width:36px;height:36px;border-radius:8px;background:#1f2a2a;display:grid;place-items:center;flex:none;color:var(--acc2)}
.card b{display:block;font-weight:600;font-size:15px}
.card p{margin:3px 0 0;color:var(--mut);font-size:13px;max-width:900px}
.card .acts{margin-left:auto;display:flex;gap:6px;flex:none}
.ibtn{background:transparent;border:1px solid transparent;border-radius:8px;min-width:36px;height:36px;display:inline-grid;place-items:center;color:var(--mut);padding:0 8px}
.ibtn:hover{background:#23262b;color:var(--ink)}
.ibtn:focus-visible,.btn:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}
.btn{background:var(--acc);border:0;border-radius:10px;height:44px;padding:0 18px;font-weight:600;display:inline-flex;align-items:center;gap:8px;color:#fff}
.btn.ghost{background:#23262b}
.btn.danger{background:var(--bad)}
.fab{position:absolute;right:24px;bottom:84px;box-shadow:0 8px 24px #0008}
.tabs{position:absolute;left:0;right:0;bottom:0;display:flex;border-top:1px solid var(--line);background:var(--panel)}
.tabs button{flex:1;background:none;border:0;padding:8px 0 10px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}
.tabs button span{width:56px;height:28px;border-radius:14px;display:grid;place-items:center}
.tabs button.on{color:var(--ink)}.tabs button.on span{background:var(--acc)}
.empty{color:var(--mut);text-align:center;padding:80px 20px}
/* ---------- editor ---------- */
#ed{position:absolute;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#cv.sim .ia{cursor:pointer}
#cv.sim [data-w],#cv.sim .term{pointer-events:none}
#cv text{pointer-events:none}
.term{cursor:crosshair}
.term:hover circle.o{stroke:var(--acc2);stroke-width:2.5}
.wire{fill:none;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke-dasharray:3 9;animation:fl .6s linear infinite;stroke-linecap:round}
@keyframes fl{to{stroke-dashoffset:-12}}
@media(prefers-reduced-motion:reduce){.flow{animation:none}}
.top{position:absolute;left:12px;top:10px;right:12px;display:flex;align-items:center;gap:10px;pointer-events:none}
.top>*{pointer-events:auto}
#ed.po .top{left:272px}
#pname{background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;font-size:15px;font-weight:600;width:min(320px,50vw)}
#pname:hover,#pname:focus{border-color:var(--line);background:var(--panel);outline:0}
.chip{font-size:12px;padding:4px 10px;border-radius:20px;background:#23262b;color:var(--mut)}
.chip.run{background:#0f3d38;color:#5eead4}
.chip.pause{background:#3d300f;color:#fcd34d}
.hint{color:var(--mut);font-size:12px;margin-left:auto;text-align:right}
.bar{position:absolute;left:0;right:0;bottom:0;height:48px;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;gap:2px;padding:0 6px}
.bar .sep{width:1px;height:24px;background:var(--line);margin:0 6px}
.bar .ibtn.on{background:#0f3d38;color:#5eead4}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #0000;cursor:pointer;flex:none}
.sw.on{border-color:#fff}
.swrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* palette */
#pal{position:absolute;left:0;top:0;bottom:48px;width:260px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:3}
#pal .s{padding:10px;border-bottom:1px solid var(--line)}
#q{width:100%;height:40px;border-radius:8px;border:1px solid var(--line);background:#111214;padding:0 12px;font-size:16px}
#pl{overflow:auto;flex:1;padding:4px 6px 20px}
.cat{display:flex;align-items:center;gap:8px;padding:10px 8px;border-radius:8px;cursor:pointer;font-weight:500}
.cat:hover{background:#1f2226}
.cat i{width:8px;height:8px;border-radius:50%}
.cat em{margin-left:auto;font-style:normal;color:var(--mut);font-size:12px}
.it{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 18px;border-radius:8px;cursor:grab;font-size:13px}
.it:hover{background:#1f2226}
.it svg{flex:none;width:34px;height:34px}
/* inspector */
#ins{position:absolute;right:12px;top:56px;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;z-index:3;box-shadow:0 12px 30px #0006}
#ins h3{margin:0 0 2px;font-size:15px}
#ins .k{color:var(--mut);font-size:12px;margin:0 0 12px}
#ins label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
#ins input,#ins select{width:100%;height:40px;border-radius:8px;border:1px solid var(--line);background:#111214;padding:0 10px;font-size:16px}
#ins .row{display:flex;gap:8px;margin-top:14px}
#ins .row .btn{flex:1;height:40px;padding:0 10px;font-size:13px;justify-content:center}
#ins textarea{width:100%;border-radius:8px;border:1px solid var(--line);background:#0b0c0e;color:#d1fae5;font:13px/1.5 ui-monospace,Consolas,monospace;padding:8px;resize:vertical}
.perr{margin:6px 0 0;font-size:12px;color:#4ade80;white-space:pre-wrap}.perr.bad{color:#f87171}
.phelp{font-size:12px;color:var(--mut);margin-top:6px}.phelp p{margin:6px 0 0;line-height:1.6}.phelp summary{cursor:pointer}
#ins{max-height:calc(100vh - 130px);overflow:auto}
/* log */
#log{position:absolute;right:12px;bottom:60px;width:min(360px,calc(100vw - 24px));max-height:40vh;overflow:auto;display:flex;flex-direction:column;gap:6px;z-index:2}
.msg{background:#1c1f23ee;border:1px solid var(--line);border-left:3px solid var(--acc2);border-radius:8px;padding:8px 10px;font-size:13px}
.msg.w{border-left-color:var(--warn)}.msg.e{border-left-color:var(--bad)}
.msg small{color:var(--mut);margin-right:6px}
/* modal */
#mod{position:absolute;inset:0;background:#000a;display:grid;place-items:center;z-index:10}
#mod .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(420px,92vw)}
#mod h3{margin:0 0 12px}
#mod input{width:100%;height:44px;border-radius:8px;border:1px solid var(--line);background:#111214;padding:0 12px;font-size:16px}
#mod .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
@media(max-width:700px){#pal{width:100%;max-width:300px}.hint{display:none}#ins{left:12px;right:12px;width:auto;top:auto;bottom:60px}}
</style>
</head>
<body>
<!-- ================= HOME ================= -->
<div id="home">
  <div class="hbar">
    <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div>
    <h1>Mô phỏng tủ điện</h1>
    <button class="btn ghost" id="imp">Nhập dự án</button>
  </div>
  <div class="hlist" id="hlist"></div>
  <button class="btn fab" id="newp"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>Dự án mới</button>
  <div class="tabs">
    <button id="tp" class="on"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>Dự án</button>
    <button id="tx"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg></span>Ví dụ</button>
  </div>
</div>

<!-- ================= EDITOR ================= -->
<div id="ed" class="hide">
  <svg id="cv" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2b2e33"/></pattern>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    </defs>
    <rect id="bgr" width="100%" height="100%" fill="url(#dots)"/>
    <g id="world"></g>
  </svg>
  <div class="top">
    <input id="pname" aria-label="Tên dự án">
    <span class="chip" id="mode">Chế độ lắp ráp</span>
    <span class="hint" id="hint"></span>
  </div>
  <div id="pal" class="hide"><div class="s"><input id="q" placeholder="Tìm linh kiện"></div><div id="pl"></div></div>
  <div id="ins" class="hide"></div>
  <div id="log"></div>
  <div class="bar" id="bar"></div>
</div>
<div id="mod" class="hide"><div class="box" id="modb"></div></div>

<script>
{
// ====================== helpers ======================
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const snap=v=>Math.round(v/10)*10;
const IC={
 back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',play:'<path d="M7 5v14l11-7z" fill="#22c55e" stroke="#22c55e"/>',
 stop:'<rect x="6" y="6" width="12" height="12" rx="1" stroke="#ef4444"/>',pause:'<path d="M8 5v14M16 5v14"/>',fit:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><rect x="8" y="8" width="8" height="8"/>',
 lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',unlock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/>',
 undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',redo:'<path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/>',
 reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
 copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',rot:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',dl:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',ul:'<path d="M12 21V9M7 14l5-5 5 5M5 3h14"/>',file:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/>',cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>'
};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const WCOL={nâu:'#8b5a2b',đen:'#30343a',xám:'#9aa0a6',xanh:'#2f80ed',vàngxanh:'#a3c832',đỏ:'#e04848',xanhđậm:'#3248c8',trắng:'#e8e8e8'};

// ====================== drawing primitives ======================
const R=(x,y,w,h,f,s='none',rx=4,ex='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}" stroke="${s}" ${ex}/>`;
const Tx=(x,y,t,sz=8,f='#333',a='middle',w=500)=>`<text x="${x}" y="${y}" font-size="${sz}" fill="${f}" text-anchor="${a}" font-weight="${w}">${esc(t)}</text>`;
const tag=(l,x,y)=>{const w=Math.max(26,l.length*6+10);return R(x-w/2,y-7,w,14,'#f5d000','#a88f00',2)+Tx(x,y+3.5,l,9,'#111','middle',600)};
const lever=(x,y,on,trip)=>R(x-9,y-18,18,36,'#d0d5da','#9aa3ab',3)+R(x-7,on&&!trip?y-16:y+2,14,14,trip?'#e74c3c':on?'#1b8f4a':'#4a4f55','none',2)+Tx(x,on&&!trip?y-6:y+12,trip?'T':on?'I':'O',8,'#fff');
const strip=(w,y,h,f='#cfd5da')=>R(2,y,w-4,h,f,'none',2);

// ====================== component library ======================
// terminal: [id,x,y]   side inferred: y==0 top, y==h bottom
const T=(id,x,y)=>({id,x,y});
const COIL_OPTS=['230VAC','24VDC'];
const TY={};
const def=(k,o)=>{TY[k]=Object.assign({k,params:{},pdef:[],conns:()=>[]},o)};
const CATS=[['nguon','Nguồn','#22c55e'],['dau','Đầu nối','#a3c832'],['bv','Bảo vệ','#ef4444'],['kdt','Khởi động từ','#14b8a6'],['rl','Rơ le & timer','#3b82f6'],['dk','Thiết bị điều khiển','#a855f7'],['bh','Báo hiệu','#f59e0b'],['cc','Cơ cấu chấp hành','#9ca3af'],['cb','Cảm biến','#6366f1'],['do','Đo lường','#f97316'],['pp','Phân phối','#eab308'],['dc','Biến tần','#fb7185'],['plc','PLC','#22d3ee'],['qt','Quá trình','#38bdf8']];

def('mains3',{name:'Nguồn 3 pha 400/230V',cat:'nguon',pre:'X',w:180,h:74,dark:1,
 terms:[T('L1',25,74),T('L2',55,74),T('L3',85,74),T('N',125,74),T('PE',155,74)],
 src:()=>({L1:'L1',L2:'L2',L3:'L3',N:'N',PE:'PE'}),
 draw:(c)=>R(0,0,180,74,'#22262b','#3a3f47',6)+Tx(10,16,'NGUỒN 3P + N  400/230V 50Hz',8,'#cfd3d8','start',600)+
  [['L1','#8b5a2b',25],['L2','#30343a',55],['L3','#9aa0a6',85],['N','#2f80ed',125],['PE','#a3c832',155]].map(([n,f,x])=>`<circle cx="${x}" cy="40" r="9" fill="${f}" stroke="#555"/>`+Tx(x,62,n,8,'#cfd3d8')).join('')});
def('mains1',{name:'Nguồn 1 pha 230V',cat:'nguon',pre:'X',w:110,h:74,dark:1,
 terms:[T('L',22,74),T('N',55,74),T('PE',88,74)],src:()=>({L:'L1',N:'N',PE:'PE'}),
 draw:()=>R(0,0,110,74,'#22262b','#3a3f47',6)+Tx(8,16,'NGUỒN 1P 230V',8,'#cfd3d8','start',600)+
  [['L','#8b5a2b',22],['N','#2f80ed',55],['PE','#a3c832',88]].map(([n,f,x])=>`<circle cx="${x}" cy="40" r="9" fill="${f}" stroke="#555"/>`+Tx(x,62,n,8,'#cfd3d8')).join('')});
def('psu',{name:'Bộ nguồn 24V DC',cat:'nguon',pre:'G',w:100,h:110,dark:1,prot:0,
 terms:[T('L',25,0),T('N',55,0),T('+',30,110),T('-',70,110)],
 src:(c,r)=>r.on&&!r.trip?{'+':'+24','-':'0V'}:{},
 closed:r=>!r.trip,trip:r=>{r.trip=1},
 update:(c,r,X)=>{const v=X.V(c.id,'L','N');const on=v.k==='AC'&&v.v>=230;const ch=on!==!!r.on;r.on=on;return ch},
 draw:(c,r)=>R(0,0,100,110,'#c9ced3','#8d959c',5)+R(8,22,84,66,'#2a2e33','none',3)+Tx(50,46,'24V DC',12,'#e8eaed','middle',600)+Tx(50,62,'POWER SUPPLY',7,'#9aa0a6')+
  `<circle cx="80" cy="78" r="4" fill="${r&&r.trip?'#ef4444':r&&r.on?'#22c55e':'#3a3f45'}"/>`+Tx(16,16,'L',8)+Tx(46,16,'N',8)+Tx(30,102,'+',9)+Tx(70,102,'−',9)+tag(c.label,30,80)});

def('xterm',{name:'Cầu đấu (domino)',cat:'dau',pre:'X',w:24,h:70,
 terms:[T('1',12,0),T('2',12,70)],conns:()=>[['1','2']],
 draw:c=>R(0,0,24,70,'#d8dde2','#9aa3ab',3)+R(4,24,16,22,'#f5f6f7','none',1)+Tx(12,38,c.label.replace('-',''),7,'#333')});
def('xterm4',{name:'Thanh nối 4 điểm',cat:'dau',pre:'X',w:90,h:40,
 terms:[T('1',15,0),T('2',35,0),T('3',55,0),T('4',75,0)],conns:()=>[['1','2'],['2','3'],['3','4']],
 draw:c=>R(0,0,90,40,'#c9a227','#8a6d10',3)+Tx(45,30,'BUS '+c.label,8,'#222')});

const mcbConns=(r,pairs)=>r.on&&!r.trip?pairs:[];
const brkClick=r=>{if(r.trip){r.trip=0;r.on=0}else r.on=r.on?0:1};
def('mcb1',{name:'MCB 1 cực',cat:'bv',pre:'Q',w:40,h:110,prot:1,st:{on:1},ia:1,
 terms:[T('1',20,0),T('2',20,110)],conns:(c,r)=>mcbConns(r,[['1','2']]),closed:r=>r.on&&!r.trip,trip:r=>{r.trip=1},down:brkClick,
 params:{In:'6A'},pdef:[['In','Dòng định mức',['2A','6A','10A','16A','20A']]],
 draw:(c,r)=>R(0,0,40,110,'#eef0f2','#9aa3ab',4)+strip(40,2,22)+strip(40,86,22)+lever(20,55,r.on,r.trip)+Tx(20,17,'1',8)+Tx(20,100,'2',8)+Tx(20,82,'C'+c.params.In,7,'#555')+tag(c.label,20,31)});
def('mcb2',{name:'MCB 2 cực',cat:'bv',pre:'Q',w:64,h:110,prot:1,st:{on:1},ia:1,
 terms:[T('1',18,0),T('3',46,0),T('2',18,110),T('4',46,110)],conns:(c,r)=>mcbConns(r,[['1','2'],['3','4']]),closed:r=>r.on&&!r.trip,trip:r=>{r.trip=1},down:brkClick,
 draw:(c,r)=>R(0,0,64,110,'#eef0f2','#9aa3ab',4)+strip(64,2,22)+strip(64,86,22)+lever(32,55,r.on,r.trip)+Tx(18,17,'1',8)+Tx(46,17,'3',8)+Tx(18,100,'2',8)+Tx(46,100,'4',8)+tag(c.label,32,31)});
def('mcb3',{name:'MCB 3 cực',cat:'bv',pre:'Q',w:100,h:110,prot:2,st:{on:1},ia:1,

const phases=p=>['L1','L2','L3'].includes(p);
const dirOf=(a,b,c)=>{const s=a+b+c;return['L1L2L3','L2L3L1','L3L1L2'].includes(s)?'thuận':'ngược'};
const motorPost=kind=>(c,r,X,dt)=>{
 if(r.burnt){r.run=0;return}
 let run=0,mode='',msg='',sp=0;
 const P=t=>X.pot(c.id,t);
 if(kind===3){const a=P('U'),b=P('V'),d=P('W');const ph=[a,b,d].filter(phases);const u=new Set(ph);
  if(u.size===3){run=1;msg='Chạy '+dirOf(a,b,d);sp=1}else if(u.size>=1&&ph.length>=2){msg='MẤT PHA';sp=-1}}
 else{const a=P('U1'),b=P('V1'),d=P('W1');const u=new Set([a,b,d].filter(phases));
  if(u.size===3){const n=['U2','V2','W2'];const nets=n.map(t=>X.net(c.id,t));const p2=n.map(P);
   if(nets[0]===nets[1]&&nets[1]===nets[2]&&!p2[0]){run=1;mode='Y';msg='Sao (Y) '+dirOf(a,b,d);sp=.45}
   else if(p2.every(phases)&&p2[0]!==a&&p2[1]!==b&&p2[2]!==d&&new Set(p2).size===3){run=1;mode='Δ';msg='Tam giác (Δ) '+dirOf(a,b,d);sp=1}
   else if(p2.some(x=>x)||nets[0]!==nets[1]){msg='SAI ĐẤU DÂY';sp=-1}else{msg='Hở đầu U2 V2 W2'}}
  else if(u.size>=1){msg='MẤT PHA';sp=-1}}
 if(sp<0){r.sp1=(r.sp1||0)+dt;if(r.sp1>3){const ol=X.olFor(c);if(ol){ol.r.trip=1;X.log('w',`${ol.c.label} tác động: ${c.label} ${msg.toLowerCase()} quá 3 s`);r.sp1=0;X.dirty()}else if(r.sp1>6){r.burnt=1;X.log('e',`${c.label} cháy do ${msg.toLowerCase()} kéo dài, không có rơ le nhiệt bảo vệ`)}}}else r.sp1=0;
 if(run&&(!r.run||msg!==r.base))X.log('i',`${c.label}: ${msg}`);r.base=msg;
 const f=X.vfdFor(c);if(run&&f!==null){sp*=f/50;msg+=` ${f.toFixed(0)} Hz`}
 r.run=run;r.mode=mode;r.msg=msg;r.dir=msg.includes('ngược')?-1:1;r.ang=((r.ang||0)+(run?r.dir*sp*900*dt:0))%360};

// ---------- PLC ----------
const PLCCACHE=new Map();
function plcCompile(src){
 if(PLCCACHE.has(src))return PLCCACHE.get(src);
 const out={st:[],err:null};const lines=String(src).split('\n');
 try{lines.forEach((ln,li)=>{const code=ln.replace(/\/\/.*$/,'').trim();if(!code)return;
  const tk=code.match(/[A-Za-z]+\d*|\d+(?:\.\d+)?|[()!&|=,~*+]/g)||[];let i=0;const E=m=>{throw new Error(`Dòng ${li+1}: ${m}`)};
  const peek=()=>tk[i],eat=v=>{if(tk[i]!==v)E(`thiếu “${v}”`);i++};
  const ID=/^(I[0-7]|Q[0-3]|M([0-9]|[12][0-9]|3[01])|T[0-7]|C[0-7])$/;
  const fac=()=>{let t=peek();if(t===undefined)E('biểu thức chưa hết');t=t.toUpperCase();if(t==='!'||t==='~'||t==='NOT'){i++;const f=fac();return s=>!f(s)}if(t==='('){i++;const e=exp();eat(')');return e}if(t==='1'||t==='0'){i++;const v=t==='1';return()=>v}
   if(ID.test(t)){i++;return s=>s.get(t)}E(`không hiểu “${tk[i]}”`)};
  const term=()=>{let a=fac();while(peek()&&['&','*','AND'].includes(peek().toUpperCase())){i++;const b=fac(),x=a;a=s=>x(s)&&b(s)}return a};
  const exp=()=>{let a=term();while(peek()&&['|','+','OR'].includes(peek().toUpperCase())){i++;const b=term(),x=a;a=s=>x(s)||b(s)}return a};
  let mode='=';const first=(tk[0]||'').toUpperCase();if(first==='S'||first==='SET'||first==='R'||first==='RST'){mode=first[0];i++}
  const tg=(tk[i]||'').toUpperCase();if(!/^(Q[0-3]|M([0-9]|[12][0-9]|3[01])|T[0-7]|C[0-7])$/.test(tg))E(`đích “${tk[i]||''}” không hợp lệ (Q0-Q3, M0-M31, T0-T7, C0-C7)`);i++;eat('=');
  if(tg[0]==='T'){const fn=(tk[i]||'').toUpperCase();if(fn!=='TON'&&fn!=='TOF')E('timer phải viết T0 = TON(điều kiện, giây) hoặc TOF(...)');i++;eat('(');const e=exp();eat(',');const pt=parseFloat(tk[i]);if(isNaN(pt))E('thiếu thời gian');i++;eat(')');out.st.push({k:'T',fn,id:tg,e,pt})}
  else if(tg[0]==='C'){const fn=(tk[i]||'').toUpperCase();if(fn!=='CTU')E('bộ đếm phải viết C0 = CTU(xung, reset, số đặt)');i++;eat('(');const e=exp();eat(',');const rs=exp();eat(',');const pv=parseInt(tk[i]);if(isNaN(pv))E('thiếu số đặt');i++;eat(')');out.st.push({k:'C',id:tg,e,rs,pv})}
  else{const e=exp();out.st.push({k:mode,id:tg,e})}
  if(i<tk.length)E(`thừa “${tk[i]}”`)})}catch(e){out.err=e.message}
 PLCCACHE.set(src,out);return out}
const PLC_DEF=`// Start = I0 (NO), Stop = I1 (NC), Rơ le nhiệt = I2 (NC)
Q0 = (I0 | Q0) & I1 & I2
// Q1: đèn báo lỗi khi rơ le nhiệt tác động
Q1 = !I2`;
def('plc',{name:'PLC mini 8DI / 4DO relay',cat:'plc',pre:'PLC',w:240,h:130,ia:1,params:{prog:PLC_DEF},pdef:[['prog','Chương trình','code']],
 terms:[T('L+',15,0),T('M',35,0),...[0,1,2,3,4,5,6,7].map(i=>T('I'+i,65+i*22,0)),T('1L',20,130),T('Q0',45,130),T('Q1',70,130),T('2L',110,130),T('Q2',135,130),T('Q3',160,130)],
 conns:(c,r)=>{const q=r.q||[];const o=[];if(q[0])o.push(['1L','Q0']);if(q[1])o.push(['1L','Q1']);if(q[2])o.push(['2L','Q2']);if(q[3])o.push(['2L','Q3']);return o},
 down:r=>{r.stop=r.stop?0:1},
 update:(c,r,X)=>{const prog=plcCompile(c.params.prog);r.err=prog.err;const pw=X.V(c.id,'L+','M').v===24;r.pw=pw;
  const I=[0,1,2,3,4,5,6,7].map(i=>pw&&X.V(c.id,'I'+i,'M').v===24);r.i=I;const old=(r.q||[]).join();
  r.M=r.M||{};r.T=r.T||{};r.C=r.C||{};let Q=r.Q||[0,0,0,0];
  if(!pw||prog.err||r.stop){Q=[0,0,0,0];if(!pw){r.M={};r.T={};r.C={}}}
  else{const s={get:n=>n[0]==='I'?I[+n.slice(1)]:n[0]==='Q'?!!Q[+n.slice(1)]:n[0]==='M'?!!r.M[n]:n[0]==='T'?!!(r.T[n]&&r.T[n].done):!!(r.C[n]&&r.C[n].done)};
   for(const st of prog.st){const v=!!st.e(s);
    if(st.k==='T'){const t=r.T[st.id]=r.T[st.id]||{el:0,done:false};t.in=v;t.fn=st.fn;t.pt=st.pt;if(st.fn==='TON'&&!v){t.el=0;t.done=false}if(st.fn==='TOF'&&v){t.el=0;t.done=true}}
    else if(st.k==='C'){const t=r.C[st.id]=r.C[st.id]||{n:0,prev:false,done:false};t.in=v;t.rs=!!st.rs(s);t.pv=st.pv;if(t.rs){t.n=0;t.done=false}}
    else{const set=x=>{if(st.id[0]==='Q')Q[+st.id.slice(1)]=x?1:0;else r.M[st.id]=x};if(st.k==='=')set(v);else if(v)set(st.k==='S')}}}
  r.Q=Q;r.q=Q.slice();return Q.join()!==old},
 tick:(c,r,dt)=>{let ch=false;for(const id in(r.T||{})){const t=r.T[id];if(t.fn==='TON'&&t.in&&!t.done){t.el+=dt;if(t.el>=t.pt){t.done=true;ch=true}}if(t.fn==='TOF'&&!t.in&&t.done){t.el+=dt;if(t.el>=t.pt){t.done=false;ch=true}}}
  for(const id in(r.C||{})){const t=r.C[id];if(!t.rs&&t.in&&!t.prev){t.n++;if(!t.done&&t.n>=t.pv){t.done=true;ch=true}}t.prev=t.in}return ch},
 draw:(c,r)=>{const I=r.i||[],Q=r.q||[];const err=r.err||plcCompile(c.params.prog).err;const st=!r.pw?'—':err?'ERR':r.stop?'STOP':'RUN';
  return R(0,0,240,130,'#dfe3e7','#8d959c',5)+strip(240,2,24)+strip(240,104,24)+R(6,30,228,16,'#0d8a8a','none',2)+Tx(12,41,'MINI PLC  8DI / 4DO RELAY  24VDC',7,'#fff','start',600)+
  [0,1,2,3,4,5,6,7].map(i=>`<circle cx="${65+i*22}" cy="56" r="3.5" fill="${I[i]?'#22c55e':'#2c3a30'}"/>`+Tx(65+i*22,18,'I'+i,7)).join('')+Tx(15,18,'L+',7)+Tx(35,18,'M',7)+
  [0,1,2,3].map(i=>`<circle cx="${[45,70,135,160][i]}" cy="94" r="3.5" fill="${Q[i]?'#f59e0b':'#3a3426'}"/>`+Tx([45,70,135,160][i],122,'Q'+i,7)).join('')+Tx(20,122,'1L',7)+Tx(110,122,'2L',7)+
  R(186,62,46,22,'#111','none',3)+Tx(209,77,st,9,st==='RUN'?'#4ade80':st==='ERR'?'#f87171':'#fbbf24','middle',700)+Tx(12,78,'bấm khi chạy: RUN/STOP',6,'#555','start')+tag(c.label,209,96)}});

const rot=(c,dx,dy)=>{let n=((c.rot||0)/90)%4;while(n-->0){[dx,dy]=[-dy,dx]}return[dx,dy]};
const tpos=(c,t)=>{const ty=TY[c.type],d=ty.terms.find(x=>x.id===t);if(!d)return[c.x,c.y];const[dx,dy]=rot(c,d.x-ty.w/2,d.y-ty.h/2);return[c.x+ty.w/2+dx,c.y+ty.h/2+dy]};
const tside=(c,t)=>{const ty=TY[c.type],d=ty.terms.find(x=>x.id===t);if(!d)return[0,1];return rot(c,...(d.y<=0?[0,-1]:d.y>=ty.h?[0,1]:d.x<=0?[-1,0]:[1,0]))};
const bbox=c=>{const ty=TY[c.type];const q=(c.rot||0)%180?[ty.h,ty.w]:[ty.w,ty.h];return[c.x+ty.w/2-q[0]/2,c.y+ty.h/2-q[1]/2,q[0],q[1]]};

function save(){if(!P)return;P.updated=Date.now();if(P.ex){P.ex=0;P.id=uid();P.name=P.name+' (bản sao)';$('#pname').value=P.name;projects.unshift(P)}persist()}
function snapUndo(){undoS.push(JSON.stringify({c:P.comps,w:P.wires}));if(undoS.length>100)undoS.shift();redoS=[]}
function undo(){if(!undoS.length)return;redoS.push(JSON.stringify({c:P.comps,w:P.wires}));const s=JSON.parse(undoS.pop());P.comps=s.c;P.wires=s.w;sel=null;save();render()}
function redo(){if(!redoS.length)return;undoS.push(JSON.stringify({c:P.comps,w:P.wires}));const s=JSON.parse(redoS.pop());P.comps=s.c;P.wires=s.w;sel=null;save();render()}
function nextLabel(pre){let n=1;const used=new Set(P.comps.map(c=>c.label));while(used.has('-'+pre+n))n++;return'-'+pre+n}
function addComp(type,x,y,label,params){const ty=TY[type];const c={id:uid(),type,x:snap(x),y:snap(y),label:label||nextLabel(ty.pre),params:Object.assign({},ty.params,params||{}),st:Object.assign({},ty.st||{})};P.comps.push(c);return c}

// ====================== simulation engine ======================
function buildNets(rt){
 const par={};const f=k=>{while(par[k]!==k){par[k]=par[par[k]];k=par[k]}return k};const key=(c,t)=>c+':'+t;
 for(const c of P.comps)for(const t of TY[c.type].terms)par[key(c.id,t.id)]=key(c.id,t.id);
 const un=(a,b)=>{if(par[a]===undefined||par[b]===undefined)return;const x=f(a),y=f(b);if(x!==y)par[x]=y};
 for(const w of P.wires)un(key(w.a.c,w.a.t),key(w.b.c,w.b.t));
 for(const c of P.comps)for(const[a,b]of TY[c.type].conns(c,rt[c.id]||{},rt))un(key(c.id,a),key(c.id,b));
 const net={},pots={};for(const k in par){net[k]=f(k)}
 for(const c of P.comps){const s=TY[c.type].src;if(!s)continue;const m=s(c,rt[c.id]||{},rt);for(const t in m){const n=net[key(c.id,t)];(pots[n]=pots[n]||new Set()).add(m[t])}}
 return{net,pots}}
const isShort=s=>{if(!s)return false;const ph=[...s].filter(phases);const hot=ph.length+(s.has('T1')?1:0);if(hot>1)return true;const g=s.has('N')||s.has('PE');if(ph.length&&(g||s.has('0V')||s.has('+24')||s.has('T0')))return true;if(s.has('T1')&&(s.has('T0')||s.has('0V')||s.has('+24')))return true;if(s.has('+24')&&(s.has('0V')||g||s.has('T0')))return true;return false};
const hasPE=s=>s&&s.has('PE');
const shorts=N=>Object.keys(N.pots).filter(n=>isShort(N.pots[n]));
const mainPot=s=>{if(!s||!s.size)return null;for(const p of['L1','L2','L3','T1','+24','N','T0','PE','0V'])if(s.has(p))return p;return null};
function makeX(N,rt){
 const pot=(cid,t)=>mainPot(N.pots[N.net[cid+':'+t]]);
 const V=(cid,a,b)=>{const sa=N.pots[N.net[cid+':'+a]]||new Set(),sb=N.pots[N.net[cid+':'+b]]||new Set();const pa=mainPot(sa),pb=mainPot(sb);
  if(phases(pa)&&phases(pb))return pa===pb?{v:0,k:'AC'}:{v:400,k:'AC'};
  if(phases(pa)&&(sb.has('N')||sb.has('PE'))||phases(pb)&&(sa.has('N')||sa.has('PE')))return{v:230,k:'AC'};
  if(sa.has('T1')&&sb.has('T0')||sb.has('T1')&&sa.has('T0'))return{v:230,k:'AC'};
  if(sa.has('+24')&&sb.has('0V'))return{v:24,k:'DC'};if(sb.has('+24')&&sa.has('0V'))return{v:-24,k:'DC'};return{v:0,k:''}};
 return{pot,V,net:(cid,t)=>N.net[cid+':'+t],
  coil:(c,a,b,spec)=>{const v=V(c.id,a,b);if(spec==='24VDC'){if(v.k==='AC'&&v.v)return'burn';return Math.abs(v.v)===24?'on':'off'}if(v.k==='AC'&&v.v===230)return'on';if(v.k==='AC'&&v.v===400)return'burn';return'off'},
  log:(t,m)=>simLog(t,m),dirty:()=>{sim.dirty=1},
  vfdFor:mc=>{const ins=TY[mc.type].terms.map(t=>N.net[mc.id+':'+t.id]);for(const c of P.comps){if(c.type!=='vfd')continue;if(['U','V','W'].some(t=>ins.includes(N.net[c.id+':'+t])))return rt[c.id].f||0}return null},
  olFor:mc=>{for(const c of P.comps){if(c.type!=='ol'||rt[c.id].trip)continue;const outs=['2','4','6'].map(t=>N.net[c.id+':'+t]);const ins=TY[mc.type].terms.map(t=>N.net[mc.id+':'+t.id]);if(outs.some(o=>ins.includes(o)))return{c,r:rt[c.id]}}return null}}}
function solve(){
 const rt=sim.rt;let N,i;
 for(i=0;i<40;i++){
  N=buildNets(rt);const sh=shorts(N);
  if(sh.length){
   const earth=sh.some(n=>hasPE(N.pots[n]));const cands=P.comps.filter(c=>TY[c.type].prot!==undefined&&TY[c.type].closed(rt[c.id])&&(!TY[c.type].earthOnly||earth)).sort((a,b)=>TY[a.type].prot-TY[b.type].prot);
   let done=null;
   for(const c of cands){const save=JSON.stringify(rt[c.id]);TY[c.type].trip(rt[c.id]);if(shorts(buildNets(rt)).length<sh.length){done=c;break}rt[c.id]=JSON.parse(save)}
   if(done){simLog('e',`${done.label} tác động: ${TY[done.type].earthOnly?'DÒNG RÒ / CHẠM VỎ':earth&&/^rc/.test(done.type)?'CHẠM ĐẤT':'NGẮN MẠCH'}`);continue}
   sim.fault=sh;simLog('e','Ngắn mạch không có thiết bị bảo vệ ngắt được. Mô phỏng dừng lại, kiểm tra các dây màu đỏ.');sim.paused=1;sim.N=N;return}
  const X=makeX(N,rt);let ch=false;
  for(const c of P.comps){const u=TY[c.type].update;if(u&&u(c,rt[c.id],X))ch=true}
  if(!ch)break}
 if(i>=40&&!sim.osc){sim.osc=1;simLog('w','Mạch dao động (rơ le đóng/cắt liên tục). Kiểm tra mạch tự giữ / khóa chéo.')}
 sim.N=N;sim.fault=null}
function tick(dt){
 if(!sim||sim.paused)return;const rt=sim.rt;let ch=false;
 for(const c of P.comps){const t=TY[c.type].tick;if(t&&t(c,rt[c.id],dt,rt))ch=true}
 solve();if(sim.paused){render();return}
 const X=makeX(sim.N,rt);sim.dirty=0;
 for(const c of P.comps){const p=TY[c.type].post;if(p)p(c,rt[c.id],X,dt)}
 if(sim.dirty)solve();
 sim.t+=dt;render()}
let timer=null;
function startSim(){
 const rt={};for(const c of P.comps)rt[c.id]=JSON.parse(JSON.stringify(c.st||{}));
 sim={rt,t:0,paused:0,log:[],N:null};sel=null;pending=null;$('#log').innerHTML='';
 if(!P.comps.some(c=>TY[c.type].src&&c.type!=='psu'))simLog('w','Chưa có nguồn điện. Thêm “Nguồn 3 pha” hoặc “Nguồn 1 pha”.');
 solve();timer=setInterval(()=>tick(.05),50);ui();render()}
function stopSim(){clearInterval(timer);timer=null;sim=null;$('#log').innerHTML='';ui();render()}
function simLog(t,m){if(!sim)return;const last=sim.log[sim.log.length-1];if(last&&last.m===m)return;sim.log.push({t,m,at:sim.t});const el=document.createElement('div');el.className='msg '+(t==='e'?'e':t==='w'?'w':'');el.innerHTML=`<small>${sim.t.toFixed(1)} s</small>${esc(m)}`;const L=$('#log');L.appendChild(el);while(L.children.length>6)L.firstChild.remove();L.scrollTop=1e6}

// ====================== rendering ======================
const POTC={L1:'#ff8a3d',L2:'#ff8a3d',L3:'#ff8a3d',N:'#4fc3f7','+24':'#ff5252','0V':'#7c8cff',PE:'#c6e34a'};
function route(w){
 const a=comp(w.a.c),b=comp(w.b.c);if(!a||!b)return'';
 const p1=tpos(a,w.a.t),p2=tpos(b,w.b.t),d1=tside(a,w.a.t),d2=tside(b,w.b.t);
 const s1=[p1[0]+d1[0]*14,p1[1]+d1[1]*14],s2=[p2[0]+d2[0]*14,p2[1]+d2[1]*14];
 let pts=[p1,s1];
 if(w.pts&&w.pts.length){let q=s1;for(const p of w.pts){pts.push([p[0],q[1]],p);q=p}pts.push([s2[0],q[1]])}
 else if(d1[0]&&d2[0]){let mx=d1[0]>0&&d2[0]>0?Math.max(s1[0],s2[0]):d1[0]<0&&d2[0]<0?Math.min(s1[0],s2[0]):(s1[0]+s2[0])/2;pts.push([mx,s1[1]],[mx,s2[1]])}
 else if(d1[0])pts.push([s2[0],s1[1]]);else if(d2[0])pts.push([s1[0],s2[1]]);
 else{let my;if(d1[1]<0&&d2[1]<0)my=Math.min(s1[1],s2[1]);else if(d1[1]>0&&d2[1]>0)my=Math.max(s1[1],s2[1]);else my=(s1[1]+s2[1])/2;pts.push([s1[0],my],[s2[0],my])}
 pts.push(s2,p2);return'M'+pts.map(p=>p.join(' ')).join(' L')}
function render(){
 if(!P)return;const W=$('#world');W.setAttribute('transform',`translate(${view.x} ${view.y}) scale(${view.k})`);
 $('#bgr').setAttribute('fill','url(#dots)');$('#dots').setAttribute('patternTransform',`translate(${view.x} ${view.y}) scale(${view.k})`);
 const rt=sim?sim.rt:{};const N=sim&&sim.N;const fault=new Set(sim&&sim.fault||[]);
 let h='';
 for(const c of P.comps){const ty=TY[c.type];const r=sim?rt[c.id]:Object.assign({},c.st);
  h+=`<g data-c="${c.id}" transform="translate(${c.x} ${c.y})${c.rot?` rotate(${c.rot} ${ty.w/2} ${ty.h/2})`:''}" class="${sim&&ty.ia?'ia':''}" style="cursor:${sim?(ty.ia?'pointer':'default'):'move'}">${ty.draw(c,r)}${sel&&sel.c===c.id?R(-6,-6,ty.w+12,ty.h+12,'none','#22d3ee',8,'stroke-width="2" stroke-dasharray="5 4"'):''}</g>`}
 for(const w of P.wires){const d=route(w);if(!d)continue;let col=WCOL[w.color]||WCOL.xám,flow='';
  if(N){const n=N.net[w.a.c+':'+w.a.t];const s=N.pots[n];const mp=mainPot(s);if(fault.has(n)){col='#ff1744'}else if(mp){flow=POTC[mp]}}
  const S=sel&&sel.w===w.id;
  h+=`<g data-w="${w.id}"><path d="${d}" class="wire" stroke="transparent" stroke-width="12"/>`+(S?`<path d="${d}" class="wire" stroke="#22d3ee" stroke-width="6" opacity=".6"/>`:'')+
   `<path d="${d}" class="wire" stroke="#0008" stroke-width="5"/><path d="${d}" class="wire" stroke="${flow?flow:col}" stroke-width="3"/>`+(flow?`<path d="${d}" class="flow" stroke="#fff8" stroke-width="1.6"/>`:'')+`</g>`}
 for(const c of P.comps)for(const t of TY[c.type].terms){const[x,y]=tpos(c,t.id);let f='#b8c0c8';if(N){const mp=mainPot(N.pots[N.net[c.id+':'+t.id]]);if(mp)f=POTC[mp]}
  h+=`<g class="term" data-c="${c.id}" data-t="${t.id}"><circle cx="${x}" cy="${y}" r="9" fill="transparent"/><circle class="o" cx="${x}" cy="${y}" r="5.5" fill="${f}" stroke="#4b535b" stroke-width="1.2"/><path d="M${x-3} ${y}h6M${x} ${y-3}v6" stroke="#4b535b" stroke-width="1"/></g>`}
 if(pending){const c=comp(pending.a.c);const p=tpos(c,pending.a.t);const pts=[p,...pending.pts,pending.m];let q=p,d='M'+p.join(' ');for(const x of pts.slice(1)){d+=` L${x[0]} ${q[1]} L${x[0]} ${x[1]}`;q=x}
  h+=`<path d="${d}" class="wire" stroke="${WCOL[wcol]}" stroke-width="3" stroke-dasharray="6 4" pointer-events="none"/>`}
 W.innerHTML=h;
 if(!sim)ins();}

 const b=$('#bar');const sw=Object.entries(WCOL).map(([k,v])=>`<button class="sw ${k===wcol?'on':''}" data-col="${k}" style="background:${v}" title="Dây ${k}" aria-label="Màu dây ${k}"></button>`).join('');
 if(sim){b.innerHTML=`<button class="ibtn" id="bStop" title="Dừng mô phỏng">${ic('stop')}</button><button class="ibtn ${sim.paused?'on':''}" id="bPause" title="Tạm dừng / tiếp tục">${ic(sim.paused?'play':'pause')}</button><button class="ibtn" id="bRestart" title="Chạy lại từ đầu">${ic('reset')}</button><button class="ibtn" id="bFit" title="Vừa màn hình">${ic('fit')}</button>`;
  $('#mode').textContent=sim.paused?'Tạm dừng':'Đang mô phỏng';$('#mode').className='chip '+(sim.paused?'pause':'run');$('#hint').textContent='Bấm nút nhấn, CB, công tắc để điều khiển. Giữ chuột trên nút nhấn để nhấn giữ.';$('#cv').classList.add('sim');$('#pal').classList.add('hide');$('#ins').classList.add('hide')}
 else{b.innerHTML=`<button class="ibtn" id="bBack" title="Về danh sách">${ic('back')}</button><span class="sep"></span><button class="ibtn ${palOpen?'on':''}" id="bAdd" title="Thêm linh kiện">${ic('plus')}</button><button class="ibtn" id="bRun" title="Chạy mô phỏng">${ic('play')}</button><button class="ibtn" id="bFit" title="Vừa màn hình">${ic('fit')}</button><button class="ibtn ${locked?'on':''}" id="bLock" title="Khóa vị trí linh kiện">${ic(locked?'lock':'unlock')}</button><span class="sep"></span><div class="swrow">${sw}</div><span style="flex:1"></span><button class="ibtn" id="bUndo" title="Hoàn tác (Ctrl+Z)">${ic('undo')}</button><button class="ibtn" id="bRedo" title="Làm lại (Ctrl+Y)">${ic('redo')}</button>`;
  $('#mode').textContent='Chế độ lắp ráp';$('#mode').className='chip';$('#hint').textContent=pending?'Bấm cực khác để nối, bấm nền để bẻ góc, Esc để hủy':'Bấm vào cực (chấm tròn) để bắt đầu đi dây. Kéo nền để di chuyển, cuộn để phóng to.';$('#cv').classList.remove('sim');$('#pal').classList.toggle('hide',!palOpen)}$('#ed').classList.toggle('po',palOpen&&!sim)}
$('#bar').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.col){wcol=t.dataset.col;if(sel&&sel.w){const w=P.wires.find(x=>x.id===sel.w);if(w){snapUndo();w.color=wcol;save()}}ui();render();return}
 ({bBack:()=>openHome(),bAdd:()=>{palOpen=!palOpen;ui()},bRun:startSim,bStop:stopSim,bPause:()=>{sim.paused=sim.paused?0:1;if(!sim.paused&&sim.fault){stopSim();startSim();return}ui()},bRestart:()=>{stopSim();startSim()},bFit:fit,bLock:()=>{locked=!locked;ui()},bUndo:undo,bRedo:redo}[t.id]||(()=>{}))()});

function ins(){
 const I=$('#ins');if(!sel||sim){I.classList.add('hide');return}I.classList.remove('hide');if(I.contains(document.activeElement)&&I.dataset.sel===JSON.stringify(sel))return;I.dataset.sel=JSON.stringify(sel);
 if(sel.w){const w=P.wires.find(x=>x.id===sel.w);if(!w){sel=null;I.classList.add('hide');return}
  I.innerHTML=`<h3>Dây dẫn</h3><p class="k">${esc(comp(w.a.c).label)} : ${esc(w.a.t)} → ${esc(comp(w.b.c).label)} : ${esc(w.b.t)}</p><label>Màu dây</label><div class="swrow">${Object.entries(WCOL).map(([k,v])=>`<button class="sw ${k===w.color?'on':''}" data-wc="${k}" style="background:${v}" aria-label="${k}"></button>`).join('')}</div><div class="row">${w.pts&&w.pts.length?'<button class="btn ghost" id="iStr">Đi dây tự động</button>':''}<button class="btn danger" id="iDel">${ic('trash',16)}Xóa</button></div>`;return}
 const c=comp(sel.c);if(!c){sel=null;I.classList.add('hide');return}const ty=TY[c.type];
 I.innerHTML=`<h3>${esc(ty.name)}</h3><p class="k">${CATS.find(x=>x[0]===ty.cat)[1]}</p><label for="iLab">Ký hiệu</label><input id="iLab" value="${esc(c.label)}">`+
  ty.pdef.map(([k,l,o,lt])=>`<label for="ip_${k}">${l}</label>`+(o==='num'?`<input id="ip_${k}" data-p="${k}" type="number" min="0" step="0.5" value="${esc(c.params[k])}">`
   :o==='code'?`<textarea id="ip_${k}" data-p="${k}" spellcheck="false" rows="9">${esc(c.params[k])}</textarea><pre class="perr ${plcCompile(c.params[k]).err?'bad':''}" id="perr">${esc(plcCompile(c.params[k]).err||'✓ Chương trình hợp lệ')}</pre><details class="phelp"><summary>Cú pháp</summary><p>Mỗi dòng một lệnh, thực hiện từ trên xuống như ladder.<br><b>Q0 = (I0 | Q0) & !I1</b> — gán (| hoặc, & và, ! phủ định)<br><b>S Q1 = I2</b> / <b>R Q1 = I3</b> — set / reset<br><b>T0 = TON(I4, 5)</b> — timer trễ đóng 5 s (TOF: trễ mở)<br><b>C0 = CTU(I5, I6, 3)</b> — đếm xung I5, reset I6, đặt 3<br>Biến: I0–I7, Q0–Q3, M0–M31, T0–T7, C0–C7. Ghi chú: //</p></details>`
   :o==='link'?`<select id="ip_${k}" data-p="${k}"><option value="">— chọn —</option>${P.comps.filter(x=>lt.includes(x.type)).map(x=>`<option ${x.label===c.params[k]?'selected':''}>${esc(x.label)}</option>`).join('')}</select>`
   :`<select id="ip_${k}" data-p="${k}">${o.map(v=>`<option ${v===c.params[k]?'selected':''}>${v}</option>`).join('')}</select>`)).join('')+
  `<div class="row"><button class="btn ghost" id="iRot" title="Xoay 90° (phím R)">${ic('rot',16)}Xoay</button><button class="btn ghost" id="iDup">${ic('copy',16)}Nhân bản</button><button class="btn danger" id="iDel" aria-label="Xóa">${ic('trash',16)}</button></div>`}
$('#ins').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.wc){const w=P.wires.find(x=>x.id===sel.w);snapUndo();w.color=t.dataset.wc;save();render();return}
 if(t.id==='iDel')delSel();if(t.id==='iDup')dup();if(t.id==='iRot')rotSel();if(t.id==='iStr'){const w=P.wires.find(x=>x.id===sel.w);snapUndo();w.pts=[];save();render()}});
$('#ins').addEventListener('input',e=>{if(e.target.tagName==='TEXTAREA'){const pe=$('#perr');const er=plcCompile(e.target.value).err;pe.textContent=er||'✓ Chương trình hợp lệ';pe.classList.toggle('bad',!!er)}});
$('#ins').addEventListener('change',e=>{const c=sel&&sel.c&&comp(sel.c);if(!c)return;snapUndo();if(e.target.id==='iLab')c.label=e.target.value.trim()||c.label;else if(e.target.dataset.p)c.params[e.target.dataset.p]=e.target.value;save();render()});
function delSel(){if(!sel)return;snapUndo();if(sel.w)P.wires=P.wires.filter(w=>w.id!==sel.w);else{P.comps=P.comps.filter(c=>c.id!==sel.c);P.wires=P.wires.filter(w=>w.a.c!==sel.c&&w.b.c!==sel.c)}sel=null;save();render()}

function rotSel(){const c=sel&&sel.c&&comp(sel.c);if(!c)return;snapUndo();c.rot=((c.rot||0)+90)%360;save();render()}

// ====================== pointer interaction ======================
const cv=$('#cv');
const toW=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left-view.x)/view.k,(e.clientY-r.top-view.y)/view.k]};
let pressed=null;
cv.addEventListener('pointerdown',e=>{
 const tEl=e.target.closest('[data-t]'),cEl=e.target.closest('[data-c]'),wEl=e.target.closest('[data-w]');const[x,y]=toW(e);
 if(e.button===1||e.button===2){drag={pan:1,sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};if(e.button===2&&pending){pending=null;ui();render()}return}
 if(sim){if(cEl&&!tEl){const c=comp(cEl.dataset.c),ty=TY[c.type];if(ty.down){ty.down(sim.rt[c.id]);pressed=c;solve();render()}return}drag={pan:1,sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};return}
 if(tEl){const a={c:tEl.dataset.c,t:tEl.dataset.t};
  if(!pending){pending={a,pts:[],m:[x,y],sx:e.clientX,sy:e.clientY};sel=null}
  else if(pending.a.c===a.c&&pending.a.t===a.t){pending=null}
  else finishWire(a);
  ui();render();return}
 if(pending){pending.pts.push([snap(x),snap(y)]);render();return}
 if(cEl){sel={c:cEl.dataset.c};const c=comp(sel.c);if(!locked)drag={c,ox:x-c.x,oy:y-c.y,moved:0};render();return}
 if(wEl){sel={w:wEl.dataset.w};wcol=P.wires.find(w=>w.id===sel.w).color;ui();render();return}
 drag={pan:1,sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y,des:1}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
const touches=new Map();let pinch=null;
cv.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;touches.set(e.pointerId,[e.clientX,e.clientY]);if(touches.size===2){const[a,b]=[...touches.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),k:view.k,x:view.x,y:view.y,cx:(a[0]+b[0])/2,cy:(a[1]+b[1])/2};drag=null;pending=null;if(pressed&&sim){const ty=TY[pressed.type];if(ty.up)ty.up(sim.rt[pressed.id]);pressed=null}}},true);
addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;touches.set(e.pointerId,[e.clientX,e.clientY]);if(pinch&&touches.size===2){const[a,b]=[...touches.values()];const r=cv.getBoundingClientRect();const k=Math.min(3,Math.max(.2,pinch.k*Math.hypot(a[0]-b[0],a[1]-b[1])/pinch.d));const cx=(a[0]+b[0])/2-r.left,cy=(a[1]+b[1])/2-r.top,ox=pinch.cx-r.left,oy=pinch.cy-r.top;view.k=k;view.x=cx-(ox-pinch.x)*k/pinch.k;view.y=cy-(oy-pinch.y)*k/pinch.k;render()}},true);
const tEnd=e=>{touches.delete(e.pointerId);if(touches.size<2)pinch=null};addEventListener('pointerup',tEnd,true);addEventListener('pointercancel',tEnd,true);
addEventListener('pointermove',e=>{
 if(pending){pending.m=toW(e);render()}
 if(!drag)return;
 if(drag.pan){view.x=drag.vx+e.clientX-drag.sx;view.y=drag.vy+e.clientY-drag.sy;if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>3)drag.des=0;render();return}
 const[x,y]=toW(e);const nx=snap(x-drag.ox),ny=snap(y-drag.oy);if(nx!==drag.c.x||ny!==drag.c.y){if(!drag.moved){snapUndo();drag.moved=1}drag.c.x=nx;drag.c.y=ny;render()}});
addEventListener('pointerup',e=>{
 if(pressed){const ty=TY[pressed.type];if(ty.up&&sim){ty.up(sim.rt[pressed.id]);solve();render()}pressed=null}
 if(pending&&!sim){const tEl=e.target.closest&&e.target.closest('[data-t]');if(tEl&&Math.abs(e.clientX-pending.sx)+Math.abs(e.clientY-pending.sy)>8){const a={c:tEl.dataset.c,t:tEl.dataset.t};if(a.c!==pending.a.c||a.t!==pending.a.t){finishWire(a);ui();render()}}}
 if(drag){if(drag.moved)save();if(drag.des&&!sim){sel=null;render()}drag=null}});
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;const k=Math.min(3,Math.max(.2,view.k*Math.exp(-e.deltaY*.0015)));view.x=mx-(mx-view.x)*k/view.k;view.y=my-(my-view.y)*k/view.k;view.k=k;render()},{passive:false});
function finishWire(b){snapUndo();P.wires.push({id:uid(),a:pending.a,b,pts:pending.pts,color:wcol});pending=null;save()}
addEventListener('keydown',e=>{if($('#ed').classList.contains('hide')||e.target.matches('input,select'))return;
 if(e.key==='Escape'){pending=null;sel=null;ui();render()}
 if(sim)return;
 if(e.key==='Delete'||e.key==='Backspace'){delSel()}
 if(e.key.toLowerCase()==='r'&&!e.ctrlKey&&!e.metaKey&&sel&&sel.c)rotSel();
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'&&sel&&sel.c){e.preventDefault();dup()}});
function fit(){const r=cv.getBoundingClientRect();if(!P.comps.length){view={x:r.width/2,y:r.height/2,k:1};render();return}
 let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const p of P.comps){const[x,y,w,h]=bbox(p);a=Math.min(a,x);b=Math.min(b,y-20);c=Math.max(c,x+w);d=Math.max(d,y+h)}
 const pad=60,lw=r.width-(palOpen&&!sim?260:0),lh=r.height-48-50;const k=Math.min(1.6,Math.max(.2,Math.min((lw-pad*2)/(c-a),(lh-pad*2)/(d-b))));
 view={k,x:(palOpen&&!sim?260:0)+(lw-(c-a)*k)/2-a*k,y:50+(lh-(d-b)*k)/2-b*k};render()}

let tab='p';
const ago=t=>{const s=(Date.now()-t)/1000;return s<60?'vừa xong':s<3600?Math.floor(s/60)+' phút trước':s<86400?Math.floor(s/3600)+' giờ trước':Math.floor(s/86400)+' ngày trước'};
function home(){const L=$('#hlist');$('#tp').classList.toggle('on',tab==='p');$('#tx').classList.toggle('on',tab==='x');$('#newp').classList.toggle('hide',tab!=='p');
 if(tab==='x'){L.innerHTML=EX.map((x,i)=>`<div class="card" data-ex="${i}"><div class="ic">${ic('cap',18)}</div><div><b>${esc(x.name)}</b><p>${esc(x.desc)}</p></div></div>`).join('');return}
 L.innerHTML=projects.length?projects.map(p=>`<div class="card" data-p="${p.id}"><div class="ic">${ic('file',18)}</div><div><b>${esc(p.name)}</b><p>${ago(p.updated)} · ${p.comps.length} linh kiện · ${p.wires.length} dây</p></div><div class="acts"><button class="ibtn" data-exp="${p.id}" title="Xuất JSON">${ic('dl',18)}</button><button class="ibtn" data-ren="${p.id}" title="Đổi tên">${ic('edit',18)}</button><button class="ibtn" data-del="${p.id}" title="Xóa">${ic('trash',18)}</button></div></div>`).join('')
 :`<div class="empty"><p>Chưa có dự án nào.</p><p>Bấm <b>Dự án mới</b> để bắt đầu, hoặc mở tab <b>Ví dụ</b> để xem mạch có sẵn.</p></div>`}
function modal(html,onOk){$('#modb').innerHTML=html;$('#mod').classList.remove('hide');const i=$('#modb input,#modb textarea');if(i){i.focus();i.select()}
 $('#modb').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.ok){onOk(i&&i.value)}$('#mod').classList.add('hide')};
 $('#modb').onkeydown=e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){onOk(i&&i.value);$('#mod').classList.add('hide')}if(e.key==='Escape')$('#mod').classList.add('hide')}}
$('#hlist').addEventListener('click',e=>{const r=e.target.closest('[data-ren]'),d=e.target.closest('[data-del]'),x=e.target.closest('[data-exp]');
 if(x){e.stopPropagation();const p=projects.find(q=>q.id===x.dataset.exp);const js=JSON.stringify({app:'panelsim',v:2,name:p.name,comps:p.comps,wires:p.wires});
  modal(`<h3>Xuất “${esc(p.name)}”</h3><p style="color:var(--mut);margin:0 0 8px">Sao chép đoạn này, lưu thành file .json hoặc gửi cho người khác để nhập lại.</p><textarea readonly rows="8" style="width:100%;background:#0b0c0e;border:1px solid var(--line);border-radius:8px;color:#ddd;font:12px ui-monospace,monospace;padding:8px">${esc(js)}</textarea><div class="row"><button class="btn ghost">Đóng</button><button class="btn" data-copy="1">Sao chép</button></div>`,()=>{});
  $('#modb').querySelector('[data-copy]').onclick=async ev=>{ev.stopPropagation();const b=ev.currentTarget;try{await navigator.clipboard.writeText(js);b.textContent='Đã sao chép'}catch(er){const t=$('#modb textarea');t.focus();t.select();b.textContent='Nhấn Ctrl+C'}};return}
 if(r){e.stopPropagation();const p=projects.find(x=>x.id===r.dataset.ren);modal(`<h3>Đổi tên dự án</h3><input value="${esc(p.name)}"><div class="row"><button class="btn ghost">Hủy</button><button class="btn" data-ok="1">Lưu</button></div>`,v=>{p.name=(v||'').trim()||p.name;persist();home()});return}
 if(d){e.stopPropagation();const p=projects.find(x=>x.id===d.dataset.del);modal(`<h3>Xóa “${esc(p.name)}”?</h3><p style="color:var(--mut)">Không thể khôi phục sau khi xóa.</p><div class="row"><button class="btn ghost">Hủy</button><button class="btn danger" data-ok="1">Xóa</button></div>`,()=>{projects=projects.filter(x=>x.id!==p.id);persist();home()});return}
 const c=e.target.closest('.card');if(!c)return;
 if(c.dataset.ex!==undefined){const x=EX[+c.dataset.ex];P={id:'ex',name:x.name,updated:Date.now(),comps:[],wires:[],ex:1};x.build();openEd()}
 else{P=projects.find(p=>p.id===c.dataset.p);openEd()}});
$('#imp').onclick=()=>modal(`<h3>Nhập dự án</h3><p style="color:var(--mut);margin:0 0 8px">Dán nội dung JSON đã xuất, hoặc chọn file .json.</p><textarea rows="8" style="width:100%;background:#0b0c0e;border:1px solid var(--line);border-radius:8px;color:#ddd;font:12px ui-monospace,monospace;padding:8px" placeholder='{"app":"panelsim",...}'></textarea><input type="file" accept=".json,application/json" id="impf" style="margin-top:8px;height:auto;border:0;padding:0"><p id="impe" style="color:#f87171;font-size:13px;margin:6px 0 0"></p><div class="row"><button class="btn ghost">Hủy</button><button class="btn" data-go="1">Nhập</button></div>`,()=>{});
$('#mod').addEventListener('change',async e=>{if(e.target.id!=='impf'||!e.target.files[0])return;$('#modb textarea').value=await e.target.files[0].text()});
$('#mod').addEventListener('click',e=>{if(!e.target.closest('[data-go]'))return;e.stopPropagation();try{const d=JSON.parse($('#modb textarea').value);if(!Array.isArray(d.comps)||!Array.isArray(d.wires))throw new Error('Thiếu comps / wires');
 const comps=d.comps.filter(c=>c&&TY[c.type]&&c.id),ids=new Set(comps.map(c=>c.id));const wires=d.wires.filter(w=>w&&w.a&&w.b&&ids.has(w.a.c)&&ids.has(w.b.c));
 const np={id:uid(),name:String(d.name||'Dự án nhập'),updated:Date.now(),comps,wires};projects.unshift(np);persist();$('#mod').classList.add('hide');home();
 if(comps.length<d.comps.length)alertMsg(`Bỏ qua ${d.comps.length-comps.length} linh kiện không nhận ra.`)}catch(er){$('#impe').textContent='Không đọc được: '+er.message}},true);
const alertMsg=m=>{const t=document.createElement('div');t.className='msg w';t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:20';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)};
$('#tp').onclick=()=>{tab='p';home()};$('#tx').onclick=()=>{tab='x';home()};
$('#newp').onclick=()=>modal(`<h3>Dự án mới</h3><input value="Tủ điện ${projects.length+1}"><div class="row"><button class="btn ghost">Hủy</button><button class="btn" data-ok="1">Tạo</button></div>`,v=>{P={id:uid(),name:(v||'').trim()||'Tủ điện',updated:Date.now(),comps:[],wires:[]};projects.unshift(P);persist();palOpen=true;openEd()});
function openEd(){const ids=new Set();P.comps=P.comps.filter(c=>TY[c.type]&&ids.add(c.id));P.wires=P.wires.filter(w=>ids.has(w.a.c)&&ids.has(w.b.c)&&TY[comp(w.a.c).type].terms.some(t=>t.id===w.a.t)&&TY[comp(w.b.c).type].terms.some(t=>t.id===w.b.t));$('#home').classList.add('hide');$('#ed').classList.remove('hide');$('#pname').value=P.name;undoS=[];redoS=[];sel=null;pending=null;pal();ui();fit()}
function openHome(){if(sim)stopSim();P=null;palOpen=false;$('#ed').classList.add('hide');$('#home').classList.remove('hide');home()}
home();
window.EP={plcCompile,rotSel,get P(){return P},get sim(){return sim},EX,TY,startSim,stopSim,tick,solve,openEx:i=>{const x=EX[i];P={id:'ex',name:x.name,updated:Date.now(),comps:[],wires:[],ex:1};x.build();openEd()},
 press:(lab,dn)=>{const c=P.comps.find(x=>x.label===lab);const ty=TY[c.type];(dn?ty.down:(ty.up||(()=>{})))(sim.rt[c.id]);solve();render()},rt:lab=>sim.rt[P.comps.find(x=>x.label===lab).id]};
}
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
</html>
