<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111214">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mô phỏng tủ điện</title>
<style>
/* VOICE: công cụ kỹ thuật, tối, tập trung như phần mềm thiết kế tủ điện.
   IDEA: tấm lưới lắp ráp tủ điện; dây có điện sáng lên khi chạy mô phỏng.
   PICTURE: chính bản vẽ đang chạy.
   COLOUR+TYPE: nền than #111214, nhấn teal #0f9b8e, dây có điện cam #ff8a3d; Geist.
   LAYOUT: canvas toàn màn hình, thanh công cụ dưới, thư viện trái, thuộc tính phải. */
:root{color-scheme:dark;--bg:#111214;--panel:#17191c;--line:#2a2d32;--ink:#e8eaed;--mut:#8b9098;--acc:#0f9b8e;--acc2:#14b8a6;--warn:#ff8a3d;--bad:#ef4444}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 Geist,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#ed{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
/* ---------- home ---------- */
#home{position:absolute;inset:0;display:flex;flex-direction:column}
.hbar{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.logo{width:30px;height:30px;border-radius:8px;background:var(--acc);display:grid;place-items:center}
.hbar h1{font-size:19px;font-weight:600;margin:0;flex:1}
.hlist{flex:1;overflow:auto;padding:12px 20px 110px;max-width:1100px;width:100%;margin:0 auto}
.card{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:10px;border:1px solid transparent;cursor:pointer}
.card:hover{background:#1a1c20;border-color:var(--line)}
.card .ic{width:36px;height:36px;border-radius:8px;background:#1f2a2a;display:grid;place-items:center;flex:none;color:var(--acc2)}
.card b{display:block;font-weight:600;font-size:15px}
.card p{margin:3px 0 0;color:var(--mut);font-size:13px;max-width:900px}
.card .acts{margin-left:auto;display:flex;gap:6px;flex:none}
.ibtn{background:transparent;border:1px solid transparent;border-radius:8px;min-width:36px;height:36px;display:inline-grid;place-items:center;color:var(--mut);padding:0 8px}
.ibtn:hover{background:#23262b;color:var(--ink)}
.ibtn:focus-visible,.btn:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}
.btn{background:var(--acc);border:0;border-radius:10px;height:44px;padding:0 18px;font-weight:600;display:inline-flex;align-items:center;gap:8px;color:#fff}
.btn.ghost{background:#23262b}
.btn.danger{background:var(--bad)}
.fab{position:absolute;right:24px;bottom:84px;box-shadow:0 8px 24px #0008}
.tabs{position:absolute;left:0;right:0;bottom:0;display:flex;border-top:1px solid var(--line);background:var(--panel)}
.tabs button{flex:1;background:none;border:0;padding:8px 0 10px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}
.tabs button span{width:56px;height:28px;border-radius:14px;display:grid;place-items:center}
.tabs button.on{color:var(--ink)}.tabs button.on span{background:var(--acc)}
.empty{color:var(--mut);text-align:center;padding:80px 20px}
/* ---------- editor ---------- */
#ed{position:absolute;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#cv.sim .ia{cursor:pointer}
#cv.sim [data-w],#cv.sim .term{pointer-events:none}
#cv text{pointer-events:none}
.term{cursor:crosshair}
.term:hover circle.o{stroke:var(--acc2);stroke-width:2.5}
#world.lz .fer{display:none}
.term circle.o{transition:fill .15s}
.wire{fill:none;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke-dasharray:3 9;animation:fl .6s linear infinite;stroke-linecap:round}
@keyframes fl{to{stroke-dashoffset:-12}}
@media(prefers-reduced-motion:reduce){.flow{animation:none}}
.top{position:absolute;left:12px;top:10px;right:12px;display:flex;align-items:center;gap:10px;pointer-events:none}
.top>*{pointer-events:auto}
#ed.po .top{left:272px}
#pname{background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;font-size:15px;font-weight:600;width:min(320px,50vw)}
#pname:hover,#pname:focus{border-color:var(--line);background:var(--panel);outline:0}
.chip{font-size:12px;padding:4px 10px;border-radius:20px;background:#23262b;color:var(--mut)}
.chip.run{background:#0f3d38;color:#5eead4}
.chip.pause{background:#3d300f;color:#fcd34d}
.hint{color:var(--mut);font-size:12px;margin-left:auto;text-align:right}
.bar{position:absolute;left:0;right:0;bottom:0;height:48px;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;gap:2px;padding:0 6px}
.bar .sep{width:1px;height:24px;background:var(--line);margin:0 6px}
.bar .ibtn.on{background:#0f3d38;color:#5eead4}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #0000;cursor:pointer;flex:none}
.sw.on{border-color:#fff}
.swrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.bar .cyc{display:none;width:30px;height:30px}
@media(max-width:700px){.bar .swrow{display:none}.bar .cyc{display:block}.bar .ibtn{min-width:34px;padding:0 4px}}
/* palette */
#pal{position:absolute;left:0;top:0;bottom:48px;width:260px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:3}
#pal .s{padding:10px;border-bottom:1px solid var(--line)}
#q{width:100%;height:40px;border-radius:8px;border:1px solid var(--line);background:#111214;padding:0 12px;font-size:16px}
#pl{overflow:auto;flex:1;padding:4px 6px 20px}
.cat{display:flex;align-items:center;gap:8px;padding:10px 8px;border-radius:8px;cursor:pointer;font-weight:500}
.cat:hover{background:#1f2226}
.cat i{width:8px;height:8px;border-radius:50%}
.cat em{margin-left:auto;font-style:normal;color:var(--mut);font-size:12px}
.it{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 18px;border-radius:8px;cursor:grab;font-size:13px}
.it:hover{background:#1f2226}
.it svg{flex:none;width:34px;height:34px}
/* inspector */
#ins{position:absolute;right:12px;top:56px;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;z-index:3;box-shadow:0 12px 30px #0006}
#ins h3{margin:0 0 2px;font-size:15px}
#ins .k{color:var(--mut);font-size:12px;margin:0 0 12px}
#ins label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
#ins input,#ins select{width:100%;height:40px;border-radius:8px;border:1px solid var(--line);background:#111214;padding:0 10px;font-size:16px}
#ins .row{display:flex;gap:8px;margin-top:14px}
#ins .row .btn{flex:1;height:40px;padding:0 10px;font-size:13px;justify-content:center}
#ins textarea{width:100%;border-radius:8px;border:1px solid var(--line);background:#0b0c0e;color:#d1fae5;font:13px/1.5 ui-monospace,Consolas,monospace;padding:8px;resize:vertical}
.perr{margin:6px 0 0;font-size:12px;color:#4ade80;white-space:pre-wrap}.perr.bad{color:#f87171}
.phelp{font-size:12px;color:var(--mut);margin-top:6px}.phelp p{margin:6px 0 0;line-height:1.6}.phelp summary{cursor:pointer}
#ins{max-height:calc(100vh - 130px);overflow:auto}
/* log */
#log{position:absolute;right:12px;bottom:60px;width:min(360px,calc(100vw - 24px));max-height:40vh;overflow:auto;display:flex;flex-direction:column;gap:6px;z-index:2}
.msg{background:#1c1f23ee;border:1px solid var(--line);border-left:3px solid var(--acc2);border-radius:8px;padding:8px 10px;font-size:13px}
.msg.w{border-left-color:var(--warn)}.msg.e{border-left-color:var(--bad)}
.msg small{color:var(--mut);margin-right:6px}
/* modal */
#mod{position:absolute;inset:0;background:#000a;display:grid;place-items:center;z-index:10}
#mod .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(420px,92vw)}
#mod h3{margin:0 0 12px}
#mod input{width:100%;height:44px;border-radius:8px;border:1px solid var(--line);background:#111214;padding:0 12px;font-size:16px}
#mod .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#ins .ih{display:flex;align-items:center;gap:8px}#ins .ih h3{flex:1;margin:0}#ins .more{display:none;height:32px;font-size:12px;border:1px solid var(--line)}
@media(max-width:700px){#ins .row{display:none}#pal{width:100%;max-width:300px}.hint{display:none}
 #ins{left:8px;right:8px;width:auto;top:50px;bottom:auto;padding:8px 10px;max-height:60vh}
 #ins .ih h3{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#ins .more{display:inline-grid}
 #ins .ib{display:none}#ins.open .ib{display:block}#ins .row{margin-top:8px}#ins .row .btn{height:36px}
 .top #mode{display:none}#log{bottom:56px;max-height:22vh}}
</style>
</head>
<body>
<!-- ================= HOME ================= -->
<div id="home">
  <div class="hbar">
    <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div>
    <h1>Mô phỏng tủ điện</h1>
    <button class="ibtn" id="bak" title="Sao lưu tất cả dự án ra file" aria-label="Sao lưu tất cả dự án"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button>
    <button class="btn ghost" id="imp">Nhập</button>
  </div>
  <div class="hlist" id="hlist"></div>
  <button class="btn fab" id="newp"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>Dự án mới</button>
  <div class="tabs">
    <button id="tp" class="on"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>Dự án</button>
    <button id="tx"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg></span>Ví dụ</button>
  </div>
</div>

<!-- ================= EDITOR ================= -->
<div id="ed" class="hide">
  <svg id="cv" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1.1" fill="#34383e"/></pattern>
      <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".12"/></linearGradient>
      <radialGradient id="scr" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#f8fafc"/><stop offset=".55" stop-color="#c3c9d0"/><stop offset="1" stop-color="#6b7280"/></radialGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    </defs>
    <rect id="bgr" width="100%" height="100%" fill="url(#dots)"/>
    <g id="world"></g>
  </svg>
  <div class="top">
    <input id="pname" aria-label="Tên dự án">
    <span class="chip" id="mode">Chế độ lắp ráp</span>
    <span class="hint" id="hint"></span>
  </div>
  <div id="pal" class="hide"><div class="s"><input id="q" placeholder="Tìm linh kiện"></div><div id="pl"></div></div>
  <div id="ins" class="hide"></div>
  <div id="log"></div>
  <div class="bar" id="bar"></div>
</div>
<div id="mod" class="hide"><div class="box" id="modb"></div></div>

<script>
{
// ====================== helpers ======================
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const snap=v=>Math.round(v/10)*10;
const IC={
 back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',play:'<path d="M7 5v14l11-7z" fill="#22c55e" stroke="#22c55e"/>',
 stop:'<rect x="6" y="6" width="12" height="12" rx="1" stroke="#ef4444"/>',pause:'<path d="M8 5v14M16 5v14"/>',fit:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><rect x="8" y="8" width="8" height="8"/>',
 lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',unlock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/>',
 undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',redo:'<path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/>',
 reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
 copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',rot:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',dl:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',ul:'<path d="M12 21V9M7 14l5-5 5 5M5 3h14"/>',file:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/>',check:'<path d="M5 12l5 5 9-10"/>',sliders:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',route:'<path d="M5 19V9a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v10"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/>',cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>'
};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const WCOL={nâu:'#8b5a2b',đen:'#30343a',xám:'#9aa0a6',xanh:'#2f80ed',vàngxanh:'#a3c832',đỏ:'#e04848',xanhđậm:'#3248c8',trắng:'#e8e8e8'};

// ====================== drawing primitives ======================
const R=(x,y,w,h,f,s='none',rx=4,ex='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}" stroke="${s}" ${ex}/>`;
const Tx=(x,y,t,sz=8,f='#333',a='middle',w=500)=>`<text x="${x}" y="${y}" font-size="${sz}" fill="${f}" text-anchor="${a}" font-weight="${w}">${esc(t)}</text>`;
const tag=(l,x,y)=>{const w=Math.max(26,l.length*6+10);return R(x-w/2,y-7,w,14,'#f5d000','#a88f00',2)+Tx(x,y+3.5,l,9,'#111','middle',600)};
const lever=(x,y,on,trip)=>R(x-9,y-18,18,36,'#d0d5da','#9aa3ab',3)+R(x-7,on&&!trip?y-16:y+2,14,14,trip?'#e74c3c':on?'#1b8f4a':'#4a4f55','none',2)+Tx(x,on&&!trip?y-6:y+12,trip?'T':on?'I':'O',8,'#fff');
const strip=(w,y,h,f='#cfd5da')=>R(2,y,w-4,h,f,'none',2);

// ====================== component library ======================
// terminal: [id,x,y]   side inferred: y==0 top, y==h bottom
const T=(id,x,y)=>({id,x,y});
const COIL_OPTS=['230VAC','24VDC','400VAC'];
const TY={};
const def=(k,o)=>{TY[k]=Object.assign({k,params:{},pdef:[],conns:()=>[]},o)};
const CATS=[['nguon','Nguồn','#22c55e'],['dau','Đầu nối','#a3c832'],['bv','Bảo vệ','#ef4444'],['kdt','Khởi động từ','#14b8a6'],['rl','Rơ le & timer','#3b82f6'],['dk','Thiết bị điều khiển','#a855f7'],['bh','Báo hiệu','#f59e0b'],['cc','Cơ cấu chấp hành','#9ca3af'],['cb','Cảm biến','#6366f1'],['do','Đo lường','#f97316'],['pp','Phân phối','#eab308'],['dc','Biến tần & khởi động mềm','#fb7185'],['plc','PLC','#22d3ee'],['qt','Quá trình','#38bdf8']];

def('mains3',{name:'Nguồn 3 pha 400/230V',cat:'nguon',pre:'X',w:180,h:74,dark:1,
 terms:[T('L1',25,74),T('L2',55,74),T('L3',85,74),T('N',125,74),T('PE',155,74)],
 src:()=>({L1:'L1',L2:'L2',L3:'L3',N:'N',PE:'PE'}),
 draw:(c)=>R(0,0,180,74,'#22262b','#3a3f47',6)+Tx(10,16,'NGUỒN 3P + N  400/230V 50Hz',8,'#cfd3d8','start',600)+
  [['L1','#8b5a2b',25],['L2','#30343a',55],['L3','#9aa0a6',85],['N','#2f80ed',125],['PE','#a3c832',155]].map(([n,f,x])=>`<circle cx="${x}" cy="40" r="9" fill="${f}" stroke="#555"/>`+Tx(x,62,n,8,'#cfd3d8')).join('')});
def('mains1',{name:'Nguồn 1 pha 230V',cat:'nguon',pre:'X',w:110,h:74,dark:1,
 terms:[T('L',22,74),T('N',55,74),T('PE',88,74)],src:()=>({L:'L1',N:'N',PE:'PE'}),
 draw:()=>R(0,0,110,74,'#22262b','#3a3f47',6)+Tx(8,16,'NGUỒN 1P 230V',8,'#cfd3d8','start',600)+
  [['L','#8b5a2b',22],['N','#2f80ed',55],['PE','#a3c832',88]].map(([n,f,x])=>`<circle cx="${x}" cy="40" r="9" fill="${f}" stroke="#555"/>`+Tx(x,62,n,8,'#cfd3d8')).join('')});
def('psu',{name:'Bộ nguồn 24V DC',cat:'nguon',pre:'G',w:100,h:110,dark:1,prot:0,at:['L'],cur:(c,r)=>r.on&&!r.trip?.6:0,
 terms:[T('L',25,0),T('N',55,0),T('+',30,110),T('-',70,110)],
 src:(c,r)=>r.on&&!r.trip?{'+':'+24','-':'0V'}:{},
 closed:r=>!r.trip,trip:r=>{r.trip=1},
 update:(c,r,X)=>{const v=X.V(c.id,'L','N');if(v.k==='AC'&&v.v===400&&!r.burnt){r.burnt=1;X.log('e',`${c.label}: cháy bộ nguồn (cấp 400V vào đầu vào 230V)`)}const on=!r.burnt&&v.k==='AC'&&v.v===230;const ch=on!==!!r.on;r.on=on;return ch},
 draw:(c,r)=>R(0,0,100,110,'#c9ced3','#8d959c',5)+R(8,22,84,66,'#2a2e33','none',3)+Tx(50,46,'24V DC',12,'#e8eaed','middle',600)+Tx(50,62,'POWER SUPPLY',7,'#9aa0a6')+
  `<circle cx="80" cy="78" r="4" fill="${r&&r.trip?'#ef4444':r&&r.on?'#22c55e':'#3a3f45'}"/>`+Tx(16,16,'L',8)+Tx(46,16,'N',8)+Tx(30,102,'+',9)+Tx(70,102,'−',9)+tag(c.label,30,80)});

def('xterm',{name:'Cầu đấu (domino)',cat:'dau',pre:'X',w:24,h:70,
 terms:[T('1',12,0),T('2',12,70)],conns:()=>[['1','2']],
 draw:c=>R(0,0,24,70,'#d8dde2','#9aa3ab',3)+R(4,24,16,22,'#f5f6f7','none',1)+Tx(12,38,c.label.replace('-',''),7,'#333')});

const PLCCACHE=new Map();
function plcCompile(src){
 if(PLCCACHE.has(src))return PLCCACHE.get(src);
 const out={st:[],err:null};const lines=String(src).split('\n');
 try{lines.forEach((ln,li)=>{const code=ln.replace(/\/\/.*$/,'').trim();if(!code)return;
  const tk=code.match(/[A-Za-z]+\d*|\d+(?:\.\d+)?|<=|>=|[()!&|=,~*+<>]/g)||[];let i=0;const E=m=>{throw new Error(`Dòng ${li+1}: ${m}`)};
  const peek=()=>tk[i],eat=v=>{if(tk[i]!==v)E(`thiếu “${v}”`);i++};
  const ID=/^(I[0-7]|Q[0-3]|M([0-9]|[12][0-9]|3[01])|T[0-7]|C[0-7])$/;
  const fac=()=>{let t=peek();if(t===undefined)E('biểu thức chưa hết');t=t.toUpperCase();if(t==='!'||t==='~'||t==='NOT'){i++;const f=fac();return s=>!f(s)}if(t==='('){i++;const e=exp();eat(')');return e}if(t==='1'||t==='0'){i++;const v=t==='1';return()=>v}
   if(/^AI[01]$/.test(t)){i++;const op=peek();if(!['<','>','<=','>='].includes(op))E(`sau ${t} phải là phép so sánh, ví dụ ${t} > 50`);i++;const v=parseFloat(tk[i]);if(isNaN(v))E('thiếu giá trị so sánh (0–100 %)');i++;const n=+t[2];
    return op==='<'?s=>s.ai(n)<v:op==='>'?s=>s.ai(n)>v:op==='<='?s=>s.ai(n)<=v:s=>s.ai(n)>=v}
   if(ID.test(t)){i++;return s=>s.get(t)}E(`không hiểu “${tk[i]}”`)};
  const term=()=>{let a=fac();while(peek()&&['&','*','AND'].includes(peek().toUpperCase())){i++;const b=fac(),x=a;a=s=>x(s)&&b(s)}return a};
  const exp=()=>{let a=term();while(peek()&&['|','+','OR'].includes(peek().toUpperCase())){i++;const b=term(),x=a;a=s=>x(s)||b(s)}return a};
  let mode='=';const first=(tk[0]||'').toUpperCase();if(first==='S'||first==='SET'||first==='R'||first==='RST'){mode=first[0];i++}
  const tg=(tk[i]||'').toUpperCase();
  if(tg==='AQ0'&&mode==='='){i++;eat('=');const a=(tk[i]||'').toUpperCase();let src;if(/^AI[01]$/.test(a)){const n=+a[2];src=s=>s.ai(n)}else{const v=parseFloat(tk[i]);if(isNaN(v))E('viết AQ0 = AI0, AQ0 = AI1 hoặc AQ0 = số (0–100 %)');src=()=>v}i++;if(i<tk.length)E(`thừa “${tk[i]}”`);out.st.push({k:'A',id:'AQ0',src});return}
  if(!/^(Q[0-3]|M([0-9]|[12][0-9]|3[01])|T[0-7]|C[0-7])$/.test(tg))E(`đích “${tk[i]||''}” không hợp lệ (Q0-Q3, M0-M31, T0-T7, C0-C7, AQ0)`);i++;eat('=');
  if(tg[0]==='T'){const fn=(tk[i]||'').toUpperCase();if(fn!=='TON'&&fn!=='TOF')E('timer phải viết T0 = TON(điều kiện, giây) hoặc TOF(...)');i++;eat('(');const e=exp();eat(',');const pt=parseFloat(tk[i]);if(isNaN(pt))E('thiếu thời gian');i++;eat(')');out.st.push({k:'T',fn,id:tg,e,pt})}
  else if(tg[0]==='C'){const fn=(tk[i]||'').toUpperCase();if(fn!=='CTU')E('bộ đếm phải viết C0 = CTU(xung, reset, số đặt)');i++;eat('(');const e=exp();eat(',');const rs=exp();eat(',');const pv=parseInt(tk[i]);if(isNaN(pv))E('thiếu số đặt');i++;eat(')');out.st.push({k:'C',id:tg,e,rs,pv})}
  else{const e=exp();out.st.push({k:mode,id:tg,e})}
  if(i<tk.length)E(`thừa “${tk[i]}”`)})}catch(e){out.err=e.message}
 PLCCACHE.set(src,out);return out}

Q1 = !I2`;

  r.M=r.M||{};r.T=r.T||{};r.C=r.C||{};let Q=r.Q||[0,0,0,0];

  r.Q=Q;r.q=Q.slice();r.aq=aq;return Q.join()!==old},
 tick:(c,r,dt)=>{let ch=false;for(const id in(r.T||{})){const t=r.T[id];if(t.fn==='TON'&&t.in&&!t.done){t.el+=dt;if(t.el>=t.pt){t.done=true;ch=true}}if(t.fn==='TOF'&&!t.in&&t.done){t.el+=dt;if(t.el>=t.pt){t.done=false;ch=true}}}return ch},

addEventListener('keydown',e=>{if($('#ed').classList.contains('hide')||e.target.matches('input,select'))return;
 if(e.key==='Escape'){pending=null;sel=null;ui();render()}
 if(sim)return;
 if(e.key==='Delete'||e.key==='Backspace'){delSel()}
 if(e.key.toLowerCase()==='r'&&!e.ctrlKey&&!e.metaKey&&sel&&sel.c)rotSel();
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'&&sel&&sel.c){e.preventDefault();dup()}});
function fit(){const r=cv.getBoundingClientRect();if(!P.comps.length){view={x:r.width/2,y:r.height/2,k:1};render();return}
 let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const p of P.comps){const[x,y,w,h]=bbox(p);a=Math.min(a,x);b=Math.min(b,y-20);c=Math.max(c,x+w);d=Math.max(d,y+h)}
 const pad=60,lw=r.width-(palOpen&&!sim?260:0),lh=r.height-48-50;const k=Math.min(1.6,Math.max(.2,Math.min((lw-pad*2)/(c-a),(lh-pad*2)/(d-b))));
 view={k,x:(palOpen&&!sim?260:0)+(lw-(c-a)*k)/2-a*k,y:50+(lh-(d-b)*k)/2-b*k};render()}

function cleanProj(d){if(!d||!Array.isArray(d.comps)||!Array.isArray(d.wires))throw new Error('Thiếu comps / wires');
